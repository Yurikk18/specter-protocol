[package]
name = "specter-fold"
version = "0.1.0"
edition = "2021"
description = "Recursive proof folding via Nova IVC for Specter PCT tokens"

[features]
default = []
# Enable Nova IVC (requires Linux/macOS — semolina assembly is not Windows-compatible)
nova = ["nova-snark", "bellpepper-core", "ff", "pasta_curves"]

[dependencies]
specter-primitives = { path = "../specter-primitives" }
curve25519-dalek = { workspace = true }
sha2 = { workspace = true }
sha3 = { workspace = true }
rand = { workspace = true }
rand_core = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
subtle = { workspace = true }
zeroize = { workspace = true }

# Optional Nova IVC dependencies (Linux/macOS only)
nova-snark = { version = "0.29", features = ["portable"], optional = true }
bellpepper-core = { version = "0.3", default-features = false, optional = true }
ff = { version = "0.13", optional = true }
pasta_curves = { version = "0.5", features = ["repr-c"], optional = true }

[dev-dependencies]
proptest = { workspace = true }
