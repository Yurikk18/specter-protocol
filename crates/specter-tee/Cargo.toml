[package]
name = "specter-tee"
version = "0.1.0"
edition = "2021"
description = "AMD SEV-SNP / Intel TDX confidential-VM attestation and key sealing for the Specter Protocol"

[features]
default = []
# Enable the AMD SEV-SNP backend. On Linux this enables both
# request_report (via /dev/sev-guest) and verify_report (pure Rust).
# On other platforms, request_report is unavailable but the
# verification path works via the pure-Rust `crypto_nossl` backend.
sev-snp = ["dep:sev", "dep:bincode", "dep:serde"]
# A mock attestation provider for dev / CI on any platform.
mock-attestation = []

[dependencies]
specter-primitives = { path = "../specter-primitives" }
sha2 = { workspace = true }
sha3 = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }
serde = { workspace = true, optional = true }

# SEV-SNP types and pure-Rust verification. The sev crate with
# crypto_nossl uses p384 + rsa + x509-cert, all pure Rust, so it
# compiles on any target. Only the firmware::guest module (which
# does ioctls on /dev/sev-guest) is Linux-specific — and we gate
# its usage in sev_snp.rs behind #[cfg(target_os = "linux")].
sev = { version = "=6.3.1", default-features = false, features = ["snp", "crypto_nossl"], optional = true }
bincode = { version = "1.3", optional = true }
