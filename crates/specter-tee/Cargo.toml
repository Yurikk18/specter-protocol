[package]
name = "specter-tee"
version = "0.1.0"
edition = "2021"
description = "AMD SEV-SNP / Intel TDX confidential-VM attestation and key sealing for the Specter Protocol"

[features]
default = []
# Enable the AMD SEV-SNP backend (Linux-only, requires the
# /dev/sev-guest device exposed by kernel 5.19+). Uses the pure-Rust
# `crypto_nossl` backend of virtee/sev, so no OpenSSL dependency is
# introduced.
sev-snp = ["dep:sev", "dep:bincode", "dep:serde"]
# A mock attestation provider that produces deterministic, unsigned
# attestations for local Windows / CI development. NEVER enable in
# production — the mock's `verify_report` always returns Ok for
# anything that round-trips, by design.
mock-attestation = []

[dependencies]
specter-primitives = { path = "../specter-primitives" }
sha2 = { workspace = true }
sha3 = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }
serde = { workspace = true, optional = true }

# SEV-SNP guest API via virtee/sev (Linux-only). We pin 6.3.1 (latest
# in the 6.x series) with the pure-Rust verification backend so there
# is no OpenSSL C dependency.
[target.'cfg(target_os = "linux")'.dependencies]
sev = { version = "=6.3.1", default-features = false, features = ["snp", "crypto_nossl"], optional = true }
bincode = { version = "1.3", optional = true }
