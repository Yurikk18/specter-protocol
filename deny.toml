# cargo-deny configuration for the Specter Protocol workspace.
# See https://embarkstudios.github.io/cargo-deny/ for schema.

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
]
all-features = false
no-default-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
version = 2
yanked = "deny"
# These mirror the entries in audit.toml. Any actual vulnerability
# still causes cargo-deny to fail.
ignore = [
    "RUSTSEC-2025-0141",  # bincode 1.3.3 unmaintained (via nova feature)
    "RUSTSEC-2024-0436",  # paste 1.0.15 unmaintained (via halo2curves)
    "RUSTSEC-2026-0097",  # rand logger unsoundness (not applicable)
]

[licenses]
version = 2
# Production-safe licenses only. Anything else must be explicitly
# allowed below.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "BSL-1.0",
    "MPL-2.0",
    "0BSD",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
