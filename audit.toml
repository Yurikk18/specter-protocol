# cargo-audit configuration for the Specter Protocol workspace.
#
# Each entry below documents a known `cargo audit` warning that is
# NOT a vulnerability in Specter's production configuration. We
# explicitly acknowledge each one so that `cargo audit` exits with
# status 0 on clean CI runs while preserving the full advisory
# history for reviewers.

[advisories]
# IDs to ignore with rationale. Anything added here MUST include a
# `reason` explaining why Specter is not affected.
ignore = [
    # RUSTSEC-2025-0141 — `bincode 1.3.3` unmaintained.
    # Pulled in transitively by `nova-snark 0.29.0` which is itself
    # gated behind the `nova` feature flag (disabled by default and
    # only compiled on Linux/macOS for research). The production
    # verification path uses the signed transfer chain in
    # `specter-fold::accumulator`, not Nova IVC, so this advisory
    # does not affect any shipped binary.
    "RUSTSEC-2025-0141",

    # RUSTSEC-2024-0436 — `paste 1.0.15` unmaintained.
    # Pulled transitively via `halo2curves -> nova-snark 0.29.0`.
    # Same rationale as above — only reachable under the optional
    # `nova` feature.
    "RUSTSEC-2024-0436",

    # RUSTSEC-2026-0097 — `rand 0.8.5` / `rand 0.9.2` unsoundness
    # with a custom logger using `rand::rng()`. Specter never
    # installs a custom tracing logger that calls `rand::rng()`;
    # the unsoundness is only triggered by a very specific pattern
    # (overriding `log::Log` to call RNG methods recursively) which
    # is not present in any crate in this workspace. Confirmed via
    # grep: zero occurrences of `rand::rng` outside of std or test
    # harnesses.
    "RUSTSEC-2026-0097",
]
informational_warnings = ["unmaintained", "unsound", "notice"]

[output]
deny = ["vulnerability"]
format = "terminal"
quiet = false
