[workspace]
resolver = "2"
members = [
    "crates/specter-primitives",
    "crates/specter-blind-sig",
    "crates/specter-fold",
    "crates/specter-credential",
    "crates/specter-core",
    "crates/specter-offline",
    "crates/specter-net",
    "crates/specter-cli",
]

[workspace.dependencies]
curve25519-dalek = { version = ">=4.1.3", features = ["serde", "rand_core", "zeroize"] }
subtle = "2"
sha2 = "0.10"
sha3 = "0.10"
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
borsh = { version = "1", features = ["derive"] }
thiserror = "2"
hex = "0.4"
proptest = "1.5"
criterion = { version = "0.5", features = ["html_reports"] }
zeroize = { version = "1.8", features = ["derive"] }
chacha20poly1305 = "0.10"
argon2 = "0.5"
